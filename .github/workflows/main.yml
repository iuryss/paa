name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Types, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tea
          POSTGRES_PASSWORD: tea_ci_password
          POSTGRES_DB: tea_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tea -d tea_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tea:tea_ci_password@localhost:5432/tea_platform_test?schema=public
      AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-chars
      AUTH_URL: http://localhost:3000
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate + generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Auditoria de dependências (bloqueia só vulnerabilidade crítica)
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests (Jest)
        run: npm run test:ci

      - name: Build
        run: npm run build

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem de produção (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: Testes ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tea
          POSTGRES_PASSWORD: tea_ci_password
          POSTGRES_DB: tea_platform_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tea -d tea_platform_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tea:tea_ci_password@localhost:5432/tea_platform_e2e?schema=public
      E2E_DATABASE_URL: postgresql://tea:tea_ci_password@localhost:5432/tea_platform_e2e?schema=public
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Aplicar migrações no banco de testes
        run: npm run e2e:prepare

      - name: Instalar o navegador (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Testes ponta a ponta
        run: npm run e2e

      - name: Guardar relatório e rastros se algo falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
